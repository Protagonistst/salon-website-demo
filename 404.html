<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Salon Name</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e241c'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='34' fill='%23b08a4a' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;500&family=Noto+Sans+Georgian:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ivory:#faf6f0; --espresso:#2e241c; --body:#5a4a3c; --gold:#b08a4a; --gold-soft:#d9c6a0; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 22px; text-align:center;
    background:var(--ivory); color:var(--body); font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", Arial, sans-serif; }
  .mono{ width:46px; height:46px; margin:0 auto; border-radius:50%; border:1px solid var(--gold); color:var(--gold);
    display:grid; place-items:center; font-family:"Noto Serif Georgian", Georgia, serif; font-size:1.3rem; }
  h1{ margin:26px 0 0; font-family:"Noto Serif Georgian", Georgia, serif; font-weight:400; font-size:clamp(4rem,18vw,7rem);
    line-height:1; letter-spacing:.06em; color:var(--espresso); }
  .rule{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; }
  .rule::before, .rule::after{ content:""; width:56px; height:1px; background:var(--gold-soft); }
  .rule span{ width:5px; height:5px; transform:rotate(45deg); background:var(--gold); }
  p{ margin:18px auto 0; max-width:34ch; line-height:1.7; }
  p + p{ margin-top:4px; font-size:.92rem; opacity:.8; }
  a{ display:inline-block; margin-top:28px; padding:14px 26px; border-radius:100px; background:var(--espresso);
    color:var(--ivory); text-decoration:none; font-size:.92rem; }
  a:hover{ background:#3d3025; }
</style>
</head>
<body>
  <main>
    <div class="mono" aria-hidden="true">S</div>
    <h1>404</h1>
    <div class="rule" aria-hidden="true"><span></span></div>
    <p>გვერდი ვერ მოიძებნა.</p>
    <p lang="en">This page could not be found.</p>
    <a id="home" href="./">მთავარ გვერდზე / Back to home</a>
  </main>
  <script>
    /* on a GitHub Pages project site the home page is /<repo>/, not / */
    if (location.hostname.slice(-10) === 'github.io') {
      document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/';
    }
  </script>
</body>
</html>
